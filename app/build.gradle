plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvoptimizer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tvoptimizer'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}